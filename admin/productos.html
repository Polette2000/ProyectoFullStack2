<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administracion de productos de Perfulandia">
    <title>Productos Admin | Perfulandia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="admin-body">
    <header class="admin-header">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/Logo.png" alt="Logo Perfulandia" class="logo">
                <span class="nombre-marca">Perfulandia Admin</span>
            </a>

            <nav class="admin-nav">
                <a href="index.html">Dashboard</a>
                <a class="active" href="productos.html">Productos</a>
                <a href="../pages/productos.html">Ver tienda</a>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <section class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 admin-page-title">
                <div>
                    <p class="section-subtitulo">Inventario</p>
                    <h1>Productos</h1>
                    <p>Consulta cuantos productos hay y administra el stock disponible.</p>
                </div>

                <a href="producto-form.html" class="btn btn-perfulandia">
                    <i class="bi bi-plus-circle"></i>
                    Nuevo producto
                </a>
            </div>

            <div class="row g-4 mb-4">
                <article class="col-md-4">
                    <div class="admin-stat">
                        <i class="bi bi-box"></i>
                        <span>Productos registrados</span>
                        <strong id="totalProductosAdmin">0</strong>
                    </div>
                </article>

                <article class="col-md-4">
                    <div class="admin-stat">
                        <i class="bi bi-stack"></i>
                        <span>Stock total</span>
                        <strong id="stockTotalAdmin">0</strong>
                    </div>
                </article>

                <article class="col-md-4">
                    <div class="admin-stat">
                        <i class="bi bi-exclamation-circle"></i>
                        <span>Sin stock</span>
                        <strong id="productosSinStockAdmin">0</strong>
                    </div>
                </article>
            </div>

            <div class="admin-table-wrap">
                <table class="table align-middle admin-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoria</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosAdmin"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>

</html>
