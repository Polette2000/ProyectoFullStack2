<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de productos de Perfulandia">
    <title>Formulario Producto | Perfulandia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="admin-body">
    <header class="admin-header">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/Logo.png" alt="Logo Perfulandia" class="logo">
                <span class="nombre-marca">Perfulandia Admin</span>
            </a>

            <nav class="admin-nav">
                <a href="index.html">Dashboard</a>
                <a class="active" href="productos.html">Productos</a>
                <a href="../pages/productos.html">Ver tienda</a>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <section class="container">
            <div class="admin-page-title">
                <p class="section-subtitulo">Catalogo</p>
                <h1 id="tituloFormularioProducto">Nuevo producto</h1>
                <p>Completa los datos del perfume para mantener actualizado el inventario.</p>
            </div>

            <form id="formProductoAdmin" class="admin-form">
                <input type="hidden" id="productoId">

                <div class="row g-4">
                    <div class="col-md-8">
                        <label for="nombreProducto" class="form-label">Nombre del producto</label>
                        <input type="text" class="form-control" id="nombreProducto" required>
                    </div>

                    <div class="col-md-4">
                        <label for="categoriaProducto" class="form-label">Categoria</label>
                        <select class="form-select" id="categoriaProducto" required>
                            <option value="">Seleccionar</option>
                            <option value="Mujer">Mujer</option>
                            <option value="Hombre">Hombre</option>
                            <option value="Unisex">Unisex</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="precioProducto" class="form-label">Precio</label>
                        <input type="number" class="form-control" id="precioProducto" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label for="stockProducto" class="form-label">Stock</label>
                        <input type="number" class="form-control" id="stockProducto" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label for="imagenProducto" class="form-label">Ruta de imagen</label>
                        <input type="text" class="form-control" id="imagenProducto" placeholder="../img/Perfume1.webp" required>
                    </div>

                    <div class="col-12">
                        <label for="descripcionProducto" class="form-label">Descripcion</label>
                        <textarea class="form-control" id="descripcionProducto" rows="4" required></textarea>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-3 mt-4">
                    <button type="submit" class="btn btn-perfulandia">
                        <i class="bi bi-save"></i>
                        Guardar producto
                    </button>
                    <a href="productos.html" class="btn btn-outline-perfulandia">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>

</html>
