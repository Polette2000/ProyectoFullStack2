<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Perfulandia</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-body">

    <!-- =========================
         HEADER / NAVBAR
    ========================== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-perfulandia shadow-sm">
            <div class="container">

                <!-- Logo y nombre -->
                <a
                    class="navbar-brand d-flex align-items-center"
                    href="../index.html"
                >

                    <img
                        src="../img/Logo.png"
                        alt="Logo de Perfulandia"
                        class="logo-navbar"
                    >


                </a>

                <!-- Botón volver -->
                <a
                    href="../index.html"
                    class="btn btn-outline-secondary"
                >
                    Volver al inicio
                </a>

            </div>
        </nav>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-5">

                    <div class="card login-card shadow border-0 p-4">

                        <!-- Encabezado del login -->
                        <div class="text-center mb-4">

                            <img
                                src="../img/Logo.png"
                                alt="Logo Perfulandia"
                                class="logo-login mb-3"
                            >

                            <p class="text-secondary mb-0">
                                Ingresa a tu cuenta
                            </p>

                        </div>


                        <!-- =========================
                             FORMULARIO LOGIN
                        ========================== -->
                        <form id="formLogin" novalidate>

                            <!-- CORREO -->
                            <div class="mb-3">

                                <label
                                    for="correo"
                                    class="form-label"
                                >
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    maxlength="100"
                                    autocomplete="email"
                                    placeholder="ejemplo@gmail.com"
                                    required
                                >

                                <!-- Mensaje de ayuda -->
                                <div class="form-text">
                                    Puedes utilizar correos
                                    @duoc.cl,
                                    @profesor.duoc.cl o
                                    @gmail.com.
                                </div>

                                <!-- Mensaje de error -->
                                <div
                                    id="errorCorreo"
                                    class="text-danger small mt-1"
                                >
                                </div>

                            </div>


                            <!-- CONTRASEÑA -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    minlength="4"
                                    maxlength="10"
                                    autocomplete="current-password"
                                    placeholder="Ingresa tu contraseña"
                                    required
                                >

                                <!-- Mensaje de ayuda -->
                                <div class="form-text">
                                    La contraseña debe contener
                                    entre 4 y 10 caracteres.
                                </div>

                                <!-- Mensaje de error -->
                                <div
                                    id="errorPassword"
                                    class="text-danger small mt-1"
                                >
                                </div>

                            </div>


                            <!-- MOSTRAR CONTRASEÑA -->
                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="mostrarPassword"
                                >

                                <label
                                    class="form-check-label"
                                    for="mostrarPassword"
                                >
                                    Mostrar contraseña
                                </label>

                            </div>


                            <!-- MENSAJE GENERAL -->
                            <div
                                id="mensajeLogin"
                                class="mb-3"
                            >
                            </div>


                            <!-- BOTÓN LOGIN -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-perfulandia"
                                >
                                    Iniciar sesión
                                </button>

                            </div>

                        </form>


                        <!-- REGISTRO -->
                        <div class="text-center mt-4">

                            <p class="mb-1">
                                ¿No tienes una cuenta?
                            </p>

                            <a href="registro.html" class="link-registro">
                                Crear una cuenta
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer-perfulandia text-center py-4 mt-auto">

        <div class="container">

            <p class="mb-0">
                &copy; 2026 Perfulandia.
                Todos los derechos reservados.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Validaciones generales -->
    <script src="../js/validaciones.js"></script>

    <!-- JavaScript específico del login -->
    <script src="../js/login.js"></script>

</body>

</html>
